# Litestream configuration for the hosted Envoy node.
#
# One database (the node's SQLite file on local disk) and one S3-compatible replica
# (R2 in production, RustFS/MinIO on the local bench). Every value comes from the
# environment; the entrypoint fills in the defaults BEFORE exec'ing litestream, because
# Litestream expands the config with Go's os.Expand semantics: ${VAR} works but
# ${VAR:-default} is parsed as a variable literally named "VAR:-default" and expands to
# the empty string. Do not put :- defaults in this file.
#
# Credentials are NOT referenced here on purpose. Litestream reads
# LITESTREAM_ACCESS_KEY_ID and LITESTREAM_SECRET_ACCESS_KEY from the environment
# itself, which keeps the secret out of the rendered config.

dbs:
  - path: /data/trisa.db
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: ${LITESTREAM_PATH}
        endpoint: ${LITESTREAM_ENDPOINT}
        region: ${LITESTREAM_REGION}

        # Bucket in the path, not the hostname: R2 and the local object stores are
        # reached by endpoint URL and have no per-bucket DNS.
        force-path-style: true

        # The replication lag budget. Anything acknowledged in the last sync-interval
        # is lost if the container dies; see the risks section of the hosted node plan.
        sync-interval: 1s

        # A snapshot every hour bounds the WAL that a restore has to replay; 24 hours
        # of retention bounds what the bucket holds.
        snapshot-interval: 1h
        retention: 24h
